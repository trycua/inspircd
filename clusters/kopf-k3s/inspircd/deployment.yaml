apiVersion: apps/v1
kind: Deployment
metadata:
  name: inspircd-wasi
  namespace: gvisor-dev
  labels:
    app.kubernetes.io/name: inspircd-wasi
    app.kubernetes.io/part-of: inspircd-wasi-experiment
  annotations:
    inspircd.trycua.ai/status: "internal loopback-only canary; validate IRC through port-forward"
spec:
  replicas: 1
  minReadySeconds: 30
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: inspircd-wasi
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inspircd-wasi
        app.kubernetes.io/part-of: inspircd-wasi-experiment
    spec:
      runtimeClassName: wasmedge-inspircd-0-17-2-rc1
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: inspircd
          # Immutable artifact qualified against the dedicated handler.
          image: ghcr.io/trycua/inspircd@sha256:2239672f9e721b2f61fedb1a0c229863c576e092010bd1444f69d6637598af9d
          imagePullPolicy: IfNotPresent
          args: ["--nofork", "--config", "/irc/inspircd.conf"]
          ports:
            - name: irc
              containerPort: 6667
              protocol: TCP
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - name: runtime
              mountPath: /irc
            - name: config
              mountPath: /irc/inspircd.conf
              subPath: inspircd.conf
              readOnly: true
      volumes:
        - name: runtime
          emptyDir: {}
        - name: config
          configMap:
            name: inspircd-wasi-config
