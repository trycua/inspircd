name: Build WASI OCI artifact

on:
  push:
    branches: [master]
    paths:
      - 'Dockerfile.wasi'
      - '.github/workflows/build-wasi-oci.yml'
      - 'CMakeLists.txt'
      - 'include/**'
      - 'modules/**'
      - 'src/**'
      - 'tools/wasi/**'
      - 'tools/runtime/normalize_oci_reference.py'
  pull_request:
    paths:
      - 'Dockerfile.wasi'
      - '.github/workflows/build-wasi-oci.yml'
      - 'CMakeLists.txt'
      - 'include/**'
      - 'modules/**'
      - 'src/**'
      - 'tools/wasi/**'
      - 'tools/runtime/normalize_oci_reference.py'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Bootstrap digest-pinned tools
        run: python3 tools/wasi/bootstrap.py
      # Publish only the exact module that passed the full local WASI suite.
      # verify.sh builds build-wasi/src/inspircd.wasm before exercising it.
      - name: Build and fully validate the command module
        env:
          STRESS: '1'
        run: sh tools/wasi/verify.sh
      - name: Verify the WebAssembly module identity
        run: |
          set -eu
          test "$(head -c 8 build-wasi/src/inspircd.wasm | od -An -t x1 | tr -d ' \n')" = 0061736d01000000
          sha256sum build-wasi/src/inspircd.wasm | tee build-wasi/inspircd.wasm.sha256
      - name: Set up isolated Buildx builder
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build OCI layout without publishing
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: Dockerfile.wasi
          outputs: type=oci,dest=/tmp/inspircd-wasi.oci.tar
      - name: Normalize OCI import reference
        run: python3 tools/runtime/normalize_oci_reference.py /tmp/inspircd-wasi.oci.tar
      - name: Retain deployable artifact evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: inspircd-wasi-oci
          path: |
            /tmp/inspircd-wasi.oci.tar
            build-wasi/inspircd.wasm.sha256
          retention-days: 7

  publish:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Bootstrap digest-pinned tools
        run: python3 tools/wasi/bootstrap.py
      # Revalidate in this privileged job so the image is built from the exact
      # module that passed WASI acceptance immediately before publication.
      - name: Build and fully validate the command module
        env:
          STRESS: '1'
        run: sh tools/wasi/verify.sh
      - name: Verify the WebAssembly module identity
        run: |
          set -eu
          test "$(head -c 8 build-wasi/src/inspircd.wasm | od -An -t x1 | tr -d ' \n')" = 0061736d01000000
          sha256sum build-wasi/src/inspircd.wasm | tee build-wasi/inspircd.wasm.sha256
      - name: Set up isolated Buildx builder
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Authenticate to GHCR with the workflow package token
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish immutable OCI artifact
        id: publish
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: Dockerfile.wasi
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/inspircd:${{ github.sha }}
      - name: Record immutable image digest
        run: |
          set -eu
          test -n '${{ steps.publish.outputs.digest }}'
          printf 'image=ghcr.io/%s/inspircd@%s\n' '${{ github.repository_owner }}' '${{ steps.publish.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
          printf 'wasm_sha256=' >> "$GITHUB_STEP_SUMMARY"
          cat build-wasi/inspircd.wasm.sha256 >> "$GITHUB_STEP_SUMMARY"
      - name: Verify public package metadata and anonymous OCI access
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const response = await github.request('GET /orgs/{org}/packages/{package_type}/{package_name}', {
              org: context.repo.owner,
              package_type: 'container',
              package_name: 'inspircd',
            });
            if (response.data.visibility !== 'public') {
              core.setFailed(`expected public package visibility, got ${response.data.visibility}`);
            }
      - name: Verify anonymous OCI manifest access
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/inspircd
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -eu
          python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          image = os.environ["IMAGE"]
          digest = os.environ["DIGEST"]
          repository = image.removeprefix("ghcr.io/")
          manifest_url = f"https://ghcr.io/v2/{repository}/manifests/{digest}"
          request = urllib.request.Request(manifest_url, headers={"Accept": "application/vnd.oci.image.index.v1+json"})
          try:
              urllib.request.urlopen(request)
          except urllib.error.HTTPError as error:
              if error.code != 401:
                  raise
              challenge = error.headers["WWW-Authenticate"]
          else:
              raise SystemExit("registry did not issue the expected Bearer challenge")
          parameters = dict(item.split("=", 1) for item in challenge.removeprefix("Bearer ").split(", "))
          token_url = parameters["realm"].strip('"') + "?" + urllib.parse.urlencode({
              "service": parameters["service"].strip('"'),
              "scope": parameters["scope"].strip('"'),
          })
          with urllib.request.urlopen(token_url) as response:
              token = json.load(response)["token"]
          authenticated = urllib.request.Request(manifest_url, headers={
              "Accept": "application/vnd.oci.image.index.v1+json",
              "Authorization": f"Bearer {token}",
          })
          with urllib.request.urlopen(authenticated) as response:
              assert response.status == 200
          PY
